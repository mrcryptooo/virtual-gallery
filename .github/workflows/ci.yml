name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    # Bounds the whole job so a hung step (observed: Playwright browser
    # install stalling for hours instead of its normal ~1-2 min) fails fast
    # and reports instead of silently occupying a runner until GitHub's own
    # 360-minute default cutoff.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from package.json "packageManager" (single source of truth)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Content validation (ADR-010)
        run: pnpm validate:content

      - name: Navigation graph gate (engine-rendered projects)
        run: pnpm validate:graph

      - name: Marzipano tour gate (source tree)
        run: pnpm validate:marzipano

      - name: Build
        run: pnpm build

      - name: Marzipano tour gate (production build)
        run: node scripts/verify-marzipano.mjs apps/portfolio/dist

      - name: Token lint (design-system gate)
        run: pnpm tokens:check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` was dropped: three consecutive runs (5h39m, 15m, and a
      # bounded 6m timeout) all hung inside its `apt-get` dependency fetch,
      # right after downloading the noble-updates/universe package index --
      # a GitHub-runner/mirror networking issue, not anything in this repo.
      # ubuntu-latest already ships the shared libraries current Playwright
      # chromium/webkit need, so the browser binaries alone are sufficient.
      - name: Install Playwright browsers
        timeout-minutes: 6
        run: pnpm exec playwright install chromium webkit

      - name: E2E smoke (chromium + webkit)
        run: pnpm e2e

      # Later stages per docs/12 (added by their milestones):
      # M0.4+ → validate-packages (content gates, ADR-010)
      # M1.7  → perf budgets + Playwright perf spec (doc 08 §5)
