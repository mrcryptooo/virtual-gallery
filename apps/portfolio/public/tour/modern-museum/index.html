<!DOCTYPE html>
<html>
<head>
<!-- Integration: the tour is served at /p/modern-museum but its files live at
     /tour/modern-museum/. This base tag is the only edit to the Marzipano
     export; it makes every relative asset path resolve against the real asset
     directory instead of the public route. -->
<base href="/tour/modern-museum/">
<title>Seismic Museum</title>
<meta charset="utf-8">
<meta name="viewport" content="target-densitydpi=device-dpi, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
<style> @-ms-viewport { width: device-width; } </style>
<link rel="stylesheet" href="vendor/reset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="multiple-scenes ">

<div id="pano"></div>

<div id="titleBar">
  <h1 class="sceneName"></h1>
</div>

<!-- Seismic Museum addition: returns to the landing page. A real
     navigation (plain href, not an SPA route), matching the pattern
     every other exit from the museum already uses (the scene navigator
     and camera control never client-side-route either) -- this
     guarantees a fresh, non-bfcache-restored load of the landing page,
     which is what its entrance choreography and hero video need. -->
<a href="/" id="homeButton" class="homeButton" aria-label="Back to Home" title="Back to Home">
  <svg class="homeButton-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 11.5L12 4.5L20 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6.5 9.8V18.5C6.5 19.05 6.95 19.5 7.5 19.5H10.5V15C10.5 14.45 10.95 14 11.5 14H12.5C13.05 14 13.5 14.45 13.5 15V19.5H16.5C17.05 19.5 17.5 19.05 17.5 18.5V9.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>

<a href="javascript:void(0)" id="autorotateToggle">
  <img class="icon off" src="img/play.png">
  <img class="icon on" src="img/pause.png">
</a>

<a href="javascript:void(0)" id="fullscreenToggle">
  <img class="icon off" src="img/fullscreen.png">
  <img class="icon on" src="img/windowed.png">
</a>

<!-- Seismic Museum addition: replaces the Marzipano export's default
     top-left expandable numbered scene list (removed) with a minimal,
     always-visible, horizontally scrollable bottom scene navigator.
     Populated at runtime from window.APP_DATA.scenes in index.js so it
     never drifts out of sync with the authored scene set; navigation
     goes through the same switchScene() used everywhere else in this
     file. See index.js "Seismic Museum addition: scene navigator". -->
<nav id="sceneNavigator" class="sceneNavigator" aria-label="Museum scenes">
  <div id="sceneNavigatorTrack" class="sceneNavigator-track"></div>
</nav>

<a href="javascript:void(0)" id="viewUp" class="viewControlButton viewControlButton-1">
  <img class="icon" src="img/up.png">
</a>
<a href="javascript:void(0)" id="viewDown" class="viewControlButton viewControlButton-2">
  <img class="icon" src="img/down.png">
</a>
<a href="javascript:void(0)" id="viewLeft" class="viewControlButton viewControlButton-3">
  <img class="icon" src="img/left.png">
</a>
<a href="javascript:void(0)" id="viewRight" class="viewControlButton viewControlButton-4">
  <img class="icon" src="img/right.png">
</a>
<a href="javascript:void(0)" id="viewIn" class="viewControlButton viewControlButton-5">
  <img class="icon" src="img/plus.png">
</a>
<a href="javascript:void(0)" id="viewOut" class="viewControlButton viewControlButton-6">
  <img class="icon" src="img/minus.png">
</a>

<!-- Seismic Museum addition: not part of the Marzipano export. Captures the
     current visible view as a PNG. Purely additive -- does not touch scene
     data, hotspot topology, or navigation. -->
<button type="button" id="screenshotButton" class="screenshotButton" aria-label="Take a snapshot">
  <span class="screenshotButton-ring" aria-hidden="true"></span>
  <svg class="screenshotButton-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M8.5 5.5L9.7 3.6C9.98 3.16 10.46 2.9 10.98 2.9H13.02C13.54 2.9 14.02 3.16 14.3 3.6L15.5 5.5H18.5C19.6 5.5 20.5 6.4 20.5 7.5V17C20.5 18.1 19.6 19 18.5 19H5.5C4.4 19 3.5 18.1 3.5 17V7.5C3.5 6.4 4.4 5.5 5.5 5.5H8.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="12" cy="12.2" r="4" stroke="currentColor" stroke-width="1.4"/>
  </svg>
</button>
<div id="screenshotStatus" class="screenshotStatus" role="status" aria-live="polite"></div>

<!-- Seismic Museum addition: the post-capture preview panel. Shown once a
     capture has been composited into its final 1920x1080 artwork (base
     scene + one of five template overlays); lets the visitor confirm the
     result before it's saved anywhere, then Save / Download / Share on
     X / Close. Hidden by default; index.js toggles `is-open`. -->
<div id="screenshotPreview" class="screenshotPreview" aria-hidden="true">
  <div class="screenshotPreview-scrim" id="screenshotPreviewScrim"></div>
  <div
    class="screenshotPreview-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="screenshotPreviewTitle"
  >
    <button
      type="button"
      class="screenshotPreview-close"
      id="screenshotPreviewClose"
      aria-label="Close"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="screenshotPreview-imageWrap">
      <img id="screenshotPreviewImage" class="screenshotPreview-image" alt="Your captured museum artwork" />
    </div>
    <div class="screenshotPreview-body">
      <p id="screenshotPreviewTitle" class="screenshotPreview-title">Your artwork is ready</p>
      <p class="screenshotPreview-caption">
        This is what will appear in your profile gallery -- 1920&times;1080, template applied.
      </p>
      <div class="screenshotPreview-actions">
        <button type="button" id="screenshotPreviewSave" class="screenshotPreview-btn screenshotPreview-btn-primary">
          Save to profile
        </button>
        <button type="button" id="screenshotPreviewDownload" class="screenshotPreview-btn">
          Download
        </button>
        <button type="button" id="screenshotPreviewShare" class="screenshotPreview-btn">
          Share on X
        </button>
      </div>
      <p id="screenshotPreviewStatus" class="screenshotPreview-status" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>

<script src="vendor/screenfull.min.js" ></script>
<script src="vendor/bowser.min.js" ></script>
<script src="vendor/marzipano.js" ></script>
<!-- Seismic Museum addition: browser build of @vercel/blob/client's
     upload() (see api/screenshot-upload.ts), vendored the same way as the
     Marzipano/screenfull/bowser libraries above -- this export has no
     bundler at runtime, so real client-direct-to-Blob upload needs a
     prebuilt copy rather than an npm import. Regenerate with:
     esbuild --bundle --format=iife --global-name=VercelBlobClient
       --platform=browser --minify --target=es2020 (entry re-exports
       `upload` from '@vercel/blob/client'). -->
<script src="vendor/vercel-blob-client.js"></script>

<script src="data.js"></script>
<script src="index.js"></script>

</body>
</html>
